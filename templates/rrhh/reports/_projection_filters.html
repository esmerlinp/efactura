<form class="report-filters" method="get">
    <div class="report-filter"><label for="projection-year">Año</label><input id="projection-year" type="number" name="year" value="{{ year }}" min="2000" max="2100"></div>
    <div class="report-filter"><label for="projection-employee">Empleado</label><select id="projection-employee" name="employee_id"><option value="">Todos</option>{% for employee in filters.employees %}<option value="{{ employee.id }}" {% if filters.employee_id == employee.id %}selected{% endif %}>{{ employee.fullName or employee.firstName or employee.id }}</option>{% endfor %}</select></div>
    <div class="report-filter"><label for="projection-department">Depto.</label><select id="projection-department" name="department"><option value="">Todos</option>{% for department in filters.departments %}<option value="{{ department }}" {% if filters.department == department %}selected{% endif %}>{{ department }}</option>{% endfor %}</select></div>
    <div class="report-filter"><label for="projection-area">Área</label><select id="projection-area" name="area"><option value="">Todas</option>{% for area in filters.areas %}<option value="{{ area }}" {% if filters.area == area %}selected{% endif %}>{{ area }}</option>{% endfor %}</select></div>
    <div class="report-filter"><label for="projection-group">Grupo</label><select id="projection-group" name="group_id"><option value="">Todos</option>{% for group in filters.groups %}<option value="{{ group.id }}" {% if filters.group_id == group.id %}selected{% endif %}>{{ group.name }}</option>{% endfor %}</select></div>
    <div class="report-filter"><label for="projection-status">Estado</label><select id="projection-status" name="status"><option value="">Activos equivalentes</option>{% for status in filters.statuses %}<option value="{{ status }}" {% if filters.status == status %}selected{% endif %}>{{ status|capitalize }}</option>{% endfor %}</select></div>
    {% if kind == 'benefits' %}<div class="report-filter"><label for="projection-cutoff">Fecha de corte</label><input id="projection-cutoff" type="date" name="cutoff_date" value="{{ cutoff_date }}"></div>{% endif %}
    <div class="report-filter-actions"><button class="btn btn-primary" type="submit">Aplicar</button><a class="btn btn-ghost" href="{{ request.path }}">Limpiar</a></div>
</form>
