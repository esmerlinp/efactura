{% extends "rrhh/layout_hr.html" %}
{% block title %}Acción de Personal Masiva — {{ product_name }}{% endblock %}
{% block content %}
{% include "rrhh/_styles.html" %}

<div class="page-header hr-page-header">
    <h1 class="page-title"><i class="fa-solid fa-people-arrows"></i> Acción de Personal Masiva</h1>
    <div class="hr-page-actions">
        <a href="{{ url_for('web_rrhh.employee_list') }}" class="btn btn-ghost">
            <i class="fa-solid fa-arrow-left"></i> Volver a Empleados
        </a>
    </div>
</div>

<script>
window.ALL_EMPLOYEES = {{ all_employees | default([]) | tojson }};
window.MASS_ACTION_PRE_TYPE = {{ action_type | tojson }};
window.MASS_ACTION_PRESELECTED_IDS = {{ employee_ids | default([]) | tojson }};
{% if edit_action %}
window.MASS_ACTION_EDIT_ID = {{ edit_action.id | tojson }};
window.MASS_ACTION_EDIT_PAYLOAD = {{ (edit_action.payload or {}) | tojson }};
window.MASS_ACTION_EDIT_CHANGES = {{ (edit_action.employeeChanges or {}) | tojson }};
window.MASS_ACTION_WIZARD_STEP = {{ edit_action.wizardStep or (edit_action.wizard or {}).get('step', 1) }};
{% else %}
window.MASS_ACTION_EDIT_ID = null;
window.MASS_ACTION_EDIT_PAYLOAD = null;
window.MASS_ACTION_EDIT_CHANGES = {};
window.MASS_ACTION_WIZARD_STEP = 1;
{% endif %}
</script>

{% include "rrhh/_mass_action_modal.html" %}

<script>
document.addEventListener('DOMContentLoaded', function () {
    maOpen(window.MASS_ACTION_PRE_TYPE || '');
});
</script>
{% endblock %}
