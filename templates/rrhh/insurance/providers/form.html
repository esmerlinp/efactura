{% extends "rrhh/layout_hr.html" %}
{% block title %}Nuevo Proveedor de Seguro — {{ product_name }}{% endblock %}
{% block content %}
{% include "rrhh/_styles.html" %}
<div class="page-header hr-page-header">
    <h1 class="page-title"><i class="fa-solid fa-shield-halved"></i> Nuevo proveedor de seguro</h1>
    <div class="hr-page-actions">
        <a href="{{ url_for('web_rrhh.insurance_provider_list') }}" class="btn btn-ghost">Volver</a>
    </div>
</div>
<form method="post" class="hr-main-col" style="max-width:720px; margin-left:0;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="hr-section-card">
        <h3><i class="fa-solid fa-building-shield"></i> Datos del proveedor</h3>
        <div class="hr-form-grid">
        <div class="form-group">
            <label for="name">Nombre del proveedor <span style="color:var(--danger);">*</span></label>
            <input id="name" name="name" class="form-input" required autofocus placeholder="Ej. ARS Universal">
        </div>
        <div class="form-group">
            <label for="description">Descripción</label>
            <textarea id="description" name="description" class="form-input" rows="4" placeholder="Información adicional del proveedor"></textarea>
        </div>
        </div>
    </div>
    <div class="hr-section-card hr-actions-card hr-actions-bar">
        <a href="{{ url_for('web_rrhh.insurance_provider_list') }}" class="btn btn-ghost">Cancelar</a>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Guardar proveedor</button>
    </div>
</form>
{% endblock %}
