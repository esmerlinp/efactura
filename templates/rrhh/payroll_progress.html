{% extends "rrhh/layout_hr.html" %}
{% block title %}Procesando Nómina — {{ product_name }}{% endblock %}
{% block content %}
<div class="dashboard-container" style="text-align:center; padding-top:60px;">
    <div id="progressContainer" style="max-width:500px; margin:0 auto;">
        <i id="statusIcon" class="fa-solid fa-spinner fa-spin" style="font-size:3rem; color:var(--accent-emerald); margin-bottom:16px;"></i>
        <h2 id="statusTitle" style="margin:0 0 8px;">Procesando nómina...</h2>
        <p id="statusMessage" style="color:var(--text-muted); margin:0 0 8px;">Calculando ingresos, deducciones e ISR para todos los empleados.</p>
        <p id="currentEmployee" style="color:var(--accent-emerald); font-size:0.95rem; font-weight:600; margin:0 0 24px; min-height:1.4em;"></p>
        <div style="height:12px; background:var(--border-color); border-radius:99px; overflow:hidden; margin-bottom:8px;">
            <div id="progressBar" style="height:100%; width:0%; background:linear-gradient(90deg, var(--accent-emerald), #34d399); border-radius:99px; transition:width 0.5s;"></div>
        </div>
        <span id="progressText" style="font-size:0.85rem; color:var(--text-muted);">Iniciando...</span>
        <div id="progressActions" hidden style="margin-top:24px;">
            <a href="{{ url_for('web_rrhh.payroll_new') }}" class="btn btn-primary">Volver a nómina</a>
            <button type="button" class="btn btn-ghost" onclick="retryPoll()">Consultar de nuevo</button>
        </div>
    </div>
</div>
<script>
var jobId = '{{ job_id }}';
var pollFailures = 0;
var pollTimer = null;
function showPollingError(message) {
    document.getElementById('statusIcon').className = 'fa-solid fa-circle-exclamation';
    document.getElementById('statusIcon').style.color = 'var(--danger)';
    document.getElementById('statusTitle').textContent = 'No se pudo consultar el proceso';
    document.getElementById('statusMessage').textContent = message;
    document.getElementById('progressActions').hidden = false;
}
function retryPoll() {
    pollFailures = 0;
    document.getElementById('progressActions').hidden = true;
    document.getElementById('statusIcon').className = 'fa-solid fa-spinner fa-spin';
    document.getElementById('statusTitle').textContent = 'Procesando nómina...';
    poll();
}
function poll() {
    fetch('/rrhh/payroll/jobs/' + jobId + '/status')
        .then(function(r) {
            if (!r.ok) throw new Error(r.status === 401 ? 'La sesión expiró. Inicia sesión nuevamente.' : 'El servidor respondió con error ' + r.status + '.');
            return r.json();
        })
        .then(function(data) {
            pollFailures = 0;
            var pct = data.progress || 0;
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('statusMessage').textContent = data.message || '';

            if ((data.status === 'running' || data.status === 'pending') && data.message) {
                if (data.currentEmployeeName) {
                    document.getElementById('currentEmployee').textContent = data.currentEmployeeName;
                }
                var match = data.message.match(/Procesando (.+?) \((\d+)\/(\d+)\)/);
                if (match) {
                    document.getElementById('currentEmployee').textContent = '👤 ' + match[1];
                    document.getElementById('progressText').textContent = match[2] + '/' + match[3] + ' empleados';
                } else {
                    document.getElementById('progressText').textContent = (data.processedItems || 0) + '/' + (data.total || 0) + ' empleados';
                }
            }

            if (data.status === 'completed') {
                document.getElementById('statusIcon').className = 'fa-solid fa-circle-check';
                document.getElementById('statusIcon').style.color = 'var(--accent-emerald)';
                document.getElementById('statusTitle').textContent = '¡Nómina procesada!';
                document.getElementById('statusMessage').textContent = data.message || 'Redirigiendo al detalle...';
                document.getElementById('currentEmployee').textContent = '';
                document.getElementById('progressBar').style.width = '100%';
                if (data.result && data.result.period_id) {
                    setTimeout(function() {
                        if (data.redirect_to === 'view') {
                            window.location.href = '/rrhh/payroll/' + data.result.period_id;
                        } else {
                            window.location.href = '/rrhh/payroll/new?period_id=' + data.result.period_id;
                        }
                    }, 1500);
                } else {
                    setTimeout(function() {
                        window.location.href = '/rrhh/payroll/history';
                    }, 2000);
                }
                return;
            }
            if (data.status === 'failed') {
                document.getElementById('statusIcon').className = 'fa-solid fa-circle-exclamation';
                document.getElementById('statusIcon').style.color = 'var(--danger)';
                document.getElementById('statusTitle').textContent = 'Error en el cálculo';
                document.getElementById('statusMessage').textContent = data.error || 'Ocurrió un error inesperado.';
                document.getElementById('currentEmployee').textContent = '';
                document.getElementById('progressText').textContent = '';
                document.getElementById('progressActions').hidden = false;
                return;
            }
            pollTimer = setTimeout(poll, 1500);
        })
        .catch(function(error) {
            pollFailures += 1;
            if (pollFailures >= 3) {
                showPollingError(error.message || 'Verifica tu conexión e inténtalo nuevamente.');
                return;
            }
            pollTimer = setTimeout(poll, 2000);
        });
}
setTimeout(poll, 500);
</script>
{% endblock %}
