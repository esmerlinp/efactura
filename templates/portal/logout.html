<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión cerrada</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; min-height: 100vh; display: grid; place-items: center; }
        .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 32px; max-width: 420px; margin: 20px; text-align: center; box-shadow: 0 8px 20px rgba(15, 23, 42, .08); }
        h1 { font-size: 1.35rem; margin: 0 0 10px; }
        p { color: #475569; margin: 0 0 22px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Sesión cerrada correctamente</h1>
        <p>Para ingresar nuevamente, utilice el enlace oficial del portal recibido por correo.</p>
    </main>
</body>
</html>
