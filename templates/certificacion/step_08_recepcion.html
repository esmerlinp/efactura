{% extends "certificacion/wizard.html" %}
{% block step_content %}
<div class="cert-step-card">
    <h3><i class="fa-solid fa-tower-broadcast"></i> Inicio Prueba Recepción e-CF</h3>
    <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:16px;">
        Marca tu sistema como <strong>"listo para recepción"</strong> en el portal de certificación DGII.
        Tu endpoint de Recepción debe estar operativo para recibir e-CF de prueba.
    </p>
    <form method="POST" action="{{ url_for('web_certificacion.step_advance', step=step) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="cert-btn cert-btn-primary"><i class="fa-solid fa-check"></i> Marcar como completado y avanzar</button>
    </form>
</div>
{% endblock %}
